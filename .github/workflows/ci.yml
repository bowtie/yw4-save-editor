name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to match devEngines.packageManager in package.json.
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # vp check + typecheck + tests + production build.
      - run: bun run verify